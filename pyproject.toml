[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2ipod"
version = "0.1.0"
description = "Download music from YouTube, identify metadata via MusicBrainz, and transfer to legacy iPod/iPhone devices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
authors = [
    { name = "yt2ipod contributors" },
]
keywords = ["youtube", "ipod", "music", "metadata", "musicbrainz", "transfer"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
artwork = [
    "httpx>=0.25.0",
    "Pillow>=10.0.0",
]
tui = ["textual>=0.40.0"]
all = [
    "httpx>=0.25.0",
    "Pillow>=10.0.0",
    "textual>=0.40.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
yt2ipod = "yt2ipod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests requiring network access (deselect with '-m \"not live\"')",
    "integration: integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["yt2ipod"]
